name: todolist

services:
  api:
    build:
      context: .
      dockerfile: src/DockerFile
      args:
        APP_CONTAINER_PATH: ${APP_CONTAINER_PATH:-/opt/todolist}
        APP_CONTAINER_PORT: ${APP_CONTAINER_PORT:-8000}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: database
      DB_PORT: ${DB_CONTAINER_PORT:-5432}
      APP_CONTAINER_PORT: ${APP_CONTAINER_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:${APP_CONTAINER_PORT:-8000}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_CONTAINER_PORT'] + '/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  database:
    image: postgres:18.3
    restart: unless-stopped
    command:
      - postgres
      - -p
      - "${DB_CONTAINER_PORT:-5432}"
    volumes:
      - database_data:/var/lib/postgresql
      - ./db/01-create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_CONTAINER_PORT:-5432}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -p ${DB_CONTAINER_PORT:-5432}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  database_data:
